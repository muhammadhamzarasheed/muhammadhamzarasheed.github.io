<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not in this ledger &middot; Muhammad Hamza</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0C">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#0A0B0C;
  --raise:#121415;
  --line:#22262A;
  --line-2:#333A3F;
  --text:#EDEAE4;
  --text-2:#A0A8AD;
  --text-3:#7B858C;
  --brass:#C9AA7C;
  --brass-soft:rgba(201,170,124,.14);
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--line-2) var(--void);}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  background:var(--void);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
main{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.5rem;
  text-align:center;
}
::selection{background:var(--brass-soft);color:var(--text);}
:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:4px;}
.code{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-size:clamp(3.5rem,10vw,6rem);
  font-weight:500;
  letter-spacing:.04em;
  color:var(--brass);
  line-height:1;
}
h1{
  margin:0;
  font-size:clamp(1.5rem,4.5vw,2.5rem);
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.1;
}
p{
  margin:0;
  max-width:44ch;
  color:var(--text-2);
  line-height:1.65;
}
a.back{
  display:inline-block;
  margin-top:.75rem;
  padding:.9rem 1.6rem;
  background:var(--raise);
  border:1px solid var(--line);
  border-radius:1.125rem;
  color:var(--text);
  font-weight:500;
  text-decoration:none;
  transition:border-color .25s ease,transform .25s ease;
}
a.back:hover{border-color:var(--brass);transform:translateY(-2px);}
.stamp{
  display:flex;
  align-items:center;
  gap:.55rem;
  font-family:var(--mono);
  font-size:.6875rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--text-3);
  margin-top:1.5rem;
}
.stamp svg{height:.9rem;width:auto;color:var(--brass);flex:none;}
.figure{display:flex;flex-direction:column;align-items:center;gap:.6rem;}
.rule{display:block;width:100%;height:7px;opacity:.7;}
/* ---------- turning the page ---------- */
/* Cross-document view transitions: even a missing entry is shown on
   the same ledger, so the sheet turns on the way in and out. Old page
   slips 2% left as it fades, new page follows from the right, 240ms,
   eased. The footer stamp monogram carries the name "mark" (the only
   element on this page allowed to), so the signature morphs across
   while the page turns. Browsers without the API skip all of this and
   simply navigate; reduced motion collapses the choreography and the
   default crossfade to an instant swap. */
@view-transition{navigation:auto;}
.stamp svg{view-transition-name:mark;}
@media (prefers-reduced-motion:no-preference){
  ::view-transition-old(root){animation:240ms ease both turn-out;}
  ::view-transition-new(root){animation:240ms ease both turn-in;}
  @keyframes turn-out{to{opacity:0;transform:translateX(-2%);}}
  @keyframes turn-in{from{opacity:0;transform:translateX(2%);}}
}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*){animation-duration:.001ms !important;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms !important;transition-delay:0s !important;animation-duration:.001ms !important;}
}
</style>
</head>
<body>
<main>
<div class="figure">
<div class="code">404</div>
<svg class="rule" viewBox="0 0 200 7" preserveAspectRatio="none" aria-hidden="true" focusable="false"><line x1="0" y1="0.5" x2="200" y2="0.5" stroke="#C9AA7C" stroke-width="1"/><line x1="0" y1="6.5" x2="200" y2="6.5" stroke="#C9AA7C" stroke-width="1"/></svg>
</div>

<p>The entry you are looking for is not in this ledger. Check the reference, or return to the record and start from a figure that exists.</p>

</main>
<script src="/vendor/gsap/gsap.min.js"></script>
<script src="/vendor/gsap/ScrambleTextPlugin.min.js"></script>
<script src="/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script>
(function () {
  if (!window.gsap || !window.ScrambleTextPlugin || !window.DrawSVGPlugin) { return; }
  gsap.registerPlugin(ScrambleTextPlugin, DrawSVGPlugin);
  var code = document.querySelector(".code");
  var lines = document.querySelectorAll(".rule line");
  if (!code || lines.length !== 2) { return; }
  /* Reduced motion: the static markup is already the final state, so
     bail before any start state is applied. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
  /* Undrawn start states live here, not in CSS, so no-JS visitors see
     the figure and the ruling-off complete. */
  gsap.set(lines, { drawSVG: "0%" });
  gsap.timeline({ defaults: { ease: "power2.out" } })
    .to(code, {
      duration: 0.6,
      scrambleText: { text: "404", chars: "0123456789", speed: 1 }
    })
    .to(lines, { duration: 0.5, drawSVG: "100%" });
})();
</script>
</body>
</html>
