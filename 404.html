<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not in this ledger</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0C">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --void:#0A0B0C;
  --raise:#121415;
  --line:#22262A;
  --text:#F2F4F5;
  --text-2:#A0A8AD;
  --text-3:#7B858C;
  --brass:#C9AA7C;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1.5rem;
  text-align:center;
  padding:2rem;
  background:var(--void);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.code{
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
  font-size:clamp(3.5rem,10vw,6rem);
  font-weight:500;
  letter-spacing:.04em;
  color:var(--brass);
  line-height:1;
}
h1{
  margin:0;
  font-size:clamp(1.5rem,4.5vw,2.5rem);
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.1;
}
p{
  margin:0;
  max-width:44ch;
  color:var(--text-2);
  line-height:1.65;
}
a.back{
  display:inline-block;
  margin-top:.75rem;
  padding:.9rem 1.6rem;
  background:var(--raise);
  border:1px solid var(--line);
  border-radius:1rem;
  color:var(--text);
  font-weight:500;
  text-decoration:none;
  transition:border-color .3s ease,transform .3s ease;
}
a.back:hover{border-color:var(--brass);transform:translateY(-2px);}
a.back:focus-visible{outline:2px solid var(--brass);outline-offset:4px;}
.stamp{
  font-family:var(--mono);
  font-size:.6875rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--text-3);
  margin-top:1.5rem;
}
</style>
</head>
<body>
<div class="code">404</div>
<h1>This page does not reconcile.</h1>
<p>The entry you are looking for is not in this ledger. Check the reference, or return to the record and start from a figure that exists.</p>
<a class="back" href="/">Return to the record</a>
<div class="stamp">Muhammad Hamza &middot; muhammadhamza.co.uk</div>
</body>
</html>
